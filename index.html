<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS - Kylypso</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POS">
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#fff;font-family:system-ui,sans-serif;color:#444;z-index:2;transition:opacity .3s}
  #splash img{width:96px;height:96px;border-radius:20px}
  #splash p{margin-top:14px;font-size:14px}
  #splash.hide{opacity:0;pointer-events:none}
  #offline{display:none;margin-top:16px;text-align:center;font-size:14px}
  #offline button{margin-top:8px;padding:10px 18px;border:0;border-radius:8px;background:#222;color:#fff;font-size:15px}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <p id="msg">Loading POS...</p>
  <div id="offline">Walang internet / hindi ma-load.<br><button onclick="location.reload()">Retry</button></div>
</div>
<iframe id="app" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; autoplay"></iframe>

<script>
/* ============ ITO LANG ANG PAPALITAN KAPAG NAG-CHANGE ANG URL ============
   Ilagay dito ang Web App URL (yung nagtatapos sa /exec) */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyYroceiHVi7PcjRqcNgB580SUDMdfiC8WXg-rukOcCP5RRx3UkKq5_azCfzy46W1yk1g/exec';
/* ======================================================================== */

(function(){
  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');

  function showOffline(){
    document.getElementById('msg').style.display='none';
    document.getElementById('offline').style.display='block';
    splash.classList.remove('hide');
  }

  if (!navigator.onLine) { showOffline(); }

  frame.addEventListener('load', function(){ splash.classList.add('hide'); });
  setTimeout(function(){ if(!navigator.onLine) showOffline(); }, 15000);
  window.addEventListener('offline', showOffline);
  window.addEventListener('online', function(){ location.reload(); });

  frame.src = SCRIPT_URL;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
